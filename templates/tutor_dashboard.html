<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutor Dashboard | LearnPath</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-page">
        <h1>Tutor Dashboard</h1>
        <p>Welcome, {{ tutor[0] }}.</p>
        <p>Email: {{ tutor[1] }}</p>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
{% if success %}<p role="status" style="color: green; font-weight: 600;">{{ success }}</p>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="hourly_rate">Your hourly charge (₹)</label>
            <input id="hourly_rate" name="hourly_rate" type="number"
                   min="0" max="1000000" step="0.01"
                   value="{{ tutor[2] if tutor[2] is not none else 0 }}" required>
            <button type="submit">Save Charge</button>
        </form>
        <form method="POST" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Log Out</button>
        </form>
        <p><a href="{{ url_for('offline_learning') }}">View Find Tutor</a></p>
    </main>
</body>
</html>
